# ============================================================
#  Zenith 调试配置 (debug.yml)
# ============================================================
# 本文件由原 pocketmine.yml 的 debug 节拆出，键名与旧版完全一致。
# 老服务器首次启动会自动迁移，旧文件改名为 pocketmine.yml.old。

debug:
 #大于 1 时在控制台输出调试信息
 level: 1
 #启用 /status 与 /gc 命令
 commands: true
