rcon_password = Пароль RCON (вы сможете изменить его позже)
usage_info = Анонимные данные об использовании позволяют нам рассчитывать глобальную статистику для PocketMine-MP и его плагинов. Вы можете просмотреть её на stats.pocketmine.net
usage_disable = Хотите отключить анонимный сбор данных?
ip_get = Получение вашего внешнего и внутреннего IP
