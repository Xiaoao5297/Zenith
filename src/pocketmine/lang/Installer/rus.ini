welcome_to_pocketmine = Добро пожаловать в PocketMine-MP!\nПрежде чем начать настройку нового сервера, необходимо принять лицензию.\nPocketMine-MP распространяется под лицензией LGPL,\nкоторую можно прочитать, открыв файл LICENSE в этой папке.
