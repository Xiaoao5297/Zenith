whitelist_warning = Вам нужно будет добавить игроков в белый список

query_warning1 = Query — это протокол, используемый различными инструментами для получения информации о вашем сервере и игроках в сети.
query_warning2 = Если вы отключите его, вы не сможете использовать списки серверов.
query_disable = Хотите отключить Query?
rcon_info = RCON — это протокол для удалённого подключения к консоли сервера с использованием пароля.
