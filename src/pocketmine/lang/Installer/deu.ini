language_has_been_selected = Deutsch wurde korrekt ausgewaehlt.
skip_installer = Moechtest du den Einrichtungsassistenten ueberspringen?

welcome_to_pocketmine = Willkommen bei PocketMine-MP!\nBevor du mit der Einrichtung deines neuen Servers beginnst, musst du der Lizenz zustimmen.\nPocketMine-MP steht unter der LGPL-Lizenz,\ndie du durch Oeffnen der LICENSE-Datei in diesem Ordner lesen kannst.
accept_license = Akzeptierst du die Lizenz?
you_have_to_accept_the_license = Du musst die LGPL-Lizenz akzeptieren, um PocketMine-MP weiter nutzen zu koennen.

setting_up_server_now = Du wirst nun deinen Server einrichten.
default_values_info = Wenn du den Standardwert nicht aendern moechtest, druecke einfach die Eingabetaste.
server_properties = Du kannst sie spaeter in der server.properties-Datei bearbeiten.

name_your_server = Gib deinem Server einen Namen
name_your_motd = Gib deinem Server eine MOTD. Die MOTD ist die Nachricht, die Spieler sehen, wenn dein Server in der Serverliste erscheint.
port_warning = Aendere den Standard-Port nicht, wenn dies dein erster Server ist.
server_port = Server-Port
invalid_port = Ungueltiger Server-Port
ram_warning = Der RAM ist die maximale Speichermenge, die PocketMine-MP verwenden wird. Ein Wert von 128-256 MB wird empfohlen.
server_ram = Server-RAM in MB
gamemode_info = Waehle zwischen Kreativ (1) oder Ueberleben (0)
default_gamemode = Standard-Spielmodus
max_players = Max. Online-Spieler
spawn_protection_info = Der Spawn-Schutz verhindert das Platzieren/Zerstoeren von Blocken in der Spawn-Zone, ausser fuer OPs.
spawn_protection = Spawn-Schutz aktivieren?
level_name = Lege den Namen der Welt fest
level_type = Lege den Welttyp des Servers fest
invalid_level_type = Ungueltiger Welttyp
announce_player_achievements = Errungenschaften von Spielern bekanntgeben?

op_info = Ein OP ist der Spieler-Administrator des Servers. OPs koennen mehr Befehle ausfuehren als normale Spieler.
op_who = OP-Spielername (z.B. dein Spielname)
op_warning = Du kannst spaeter mit /op <Spieler> einen OP-Benutzer hinzufuegen.
whitelist_info = Die Whitelist erlaubt nur darauf befindlichen Spielern den Beitritt.
whitelist_enable = Moechtest du die Whitelist aktivieren?
whitelist_warning = Du musst die Spieler zur Whitelist hinzufuegen.

query_warning1 = Query ist ein Protokoll, das von verschiedenen Tools verwendet wird, um Informationen ueber deinen Server und eingeloggte Spieler zu erhalten.
query_warning2 = Wenn du es deaktivierst, kannst du keine Serverlisten verwenden.
query_disable = Moechtest du Query deaktivieren?
rcon_info = RCON ist ein Protokoll zur Fernsteuerung der Server-Konsole mittels eines Passworts.
rcon_enable = Moechtest du RCON aktivieren?
rcon_password = RCON-Passwort (du kannst es spaeter aendern)
usage_info = Die anonymen Nutzungsdaten erlauben uns, globale Statistiken fuer PocketMine-MP und seine Plugins zu berechnen. Du kannst sie auf stats.pocketmine.net einsehen.
usage_disable = Moechtest du die anonyme Nutzung deaktivieren?
ip_get = Ermittle deine externe und interne IP
ip_warning = Deine externe IP ist {{EXTERNAL_IP}}. Moeglicherweise musst du eine Portweiterleitung zu deiner internen IP {{INTERNAL_IP}} einrichten.
ip_confirm = Stelle sicher, dass du dies ueberpruefst. Wenn du weiterleitest und dies ueberspringst, koennen keine externen Spieler beitreten. [Eingabetaste]

you_have_finished = Du hast den Einrichtungsassistenten erfolgreich abgeschlossen.
pocketmine_will_start = PocketMine-MP wird nun starten. Gib /help ein, um die Liste der verfuegbaren Befehle anzuzeigen.
pocketmine_plugins = Durchstoebere das Plugin-Repository, um neue Funktionen, Minispiele oder erweiterten Schutz fuer deinen Server hinzuzufuegen.