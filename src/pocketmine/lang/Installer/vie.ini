ip_confirm = Hãy chắc chắn kiểm tra nó. [Nhấn Enter]

you_have_finished = Bạn đã hoàn thành trình hướng dẫn thiết lập
pocketmine_will_start = PocketMine-MP sẽ bắt đầu ngay bây giờ. Gõ /help để xem danh sách các lệnh có sẵn.
pocketmine_plugins = Hãy xem Kho Plugin để thêm các tính năng mới, minigame hoặc bảo vệ nâng cao cho máy chủ của bạn
