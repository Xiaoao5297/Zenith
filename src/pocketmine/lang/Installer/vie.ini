invalid_level_type = Loại thế giới không hợp lệ
announce_player_achievements = Thông báo khi người chơi đạt được thành tựu?

op_info = OP là quản trị viên máy chủ. OP có thể chạy nhiều lệnh hơn người chơi thông thường
op_who = Tên người chơi OP (ví dụ: tên trong game của bạn)
op_warning = Bạn có thể thêm người dùng OP sau bằng cách sử dụng /op <người chơi>
whitelist_info = Danh sách trắng chỉ cho phép người chơi trong danh sách tham gia.
whitelist_enable = Bạn có muốn bật danh sách trắng?
whitelist_warning = Bạn sẽ phải thêm người chơi vào danh sách trắng

query_warning1 = Query là giao thức được các công cụ khác nhau sử dụng để lấy thông tin về máy chủ và người chơi đã đăng nhập.
query_warning2 = Nếu bạn tắt nó, bạn sẽ không thể sử dụng danh sách máy chủ.
query_disable = Bạn có muốn tắt Query?
rcon_info = RCON là giao thức để kết nối từ xa với bảng điều khiển máy chủ bằng mật khẩu.
rcon_enable = Bạn có muốn bật RCON?
rcon_password = Mật khẩu RCON (bạn có thể thay đổi sau)
usage_info = Dữ liệu sử dụng ẩn danh cho phép chúng tôi tính toán thống kê toàn cầu cho PocketMine-MP và các plugin của nó.
usage_disable = Bạn có muốn tắt tính năng gửi dữ liệu ẩn danh?
