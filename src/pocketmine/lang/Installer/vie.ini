setting_up_server_now = Bạn sắp thiết lập máy chủ của mình.
default_values_info = Nếu bạn không muốn thay đổi giá trị mặc định, chỉ cần nhấn Enter.
server_properties = Bạn có thể chỉnh sửa chúng sau trong tệp server.properties.

name_your_server = Đặt tên cho máy chủ của bạn
name_your_motd = Đặt MOTD cho máy chủ, MOTD là thông báo hiển thị khi người chơi thấy máy chủ của bạn trong danh sách máy chủ.
port_warning = Không thay đổi cổng mặc định nếu đây là máy chủ đầu tiên của bạn.
server_port = Cổng máy chủ
invalid_port = Cổng máy chủ không hợp lệ
ram_warning = RAM là lượng bộ nhớ tối đa PocketMine-MP sẽ sử dụng. Giá trị 128-256 MB được khuyến nghị
server_ram = RAM máy chủ (MB)
gamemode_info = Chọn giữa Creative (1) hoặc Survival (0)
default_gamemode = Chế độ chơi mặc định
max_players = Số người chơi tối đa
spawn_protection_info = Bảo vệ khu vực sinh sản không cho phép đặt/phá khối trong khu vực sinh sản ngoại trừ OP
spawn_protection = Bật bảo vệ khu vực sinh sản?
level_name = Đặt tên cho thế giới
