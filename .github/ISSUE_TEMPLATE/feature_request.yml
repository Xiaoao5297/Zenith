name: 功能建议 / Feature Request
description: 为 Zenith 核心提出新功能或改进建议 / Suggest a new feature or improvement for the Zenith core
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请先搜索现有 issue，避免重复提交。
        Thanks for your suggestion! Please search existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to Solve
      description: 这个功能想解决什么问题？或当前有什么不方便的地方？
        What problem does this feature solve, or what is inconvenient about the current behavior?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed Solution
      description: 你希望如何实现？描述理想的行为或 API。/ How would you like it to work? Describe the ideal behavior or API.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
      description: 你还考虑过哪些其他方案？/ What alternative solutions have you considered?

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional Context
      description: 截图、示例配置、相关上游（PocketMine-MP / Genisys / SCAXE）行为等。/ Screenshots, example configs, relevant upstream (PocketMine-MP / Genisys / SCAXE) behavior, etc.

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checks
      options:
        - label: 我已搜索现有 issue，确认没有重复 / I have searched existing issues and found no duplicates
          required: true
        - label: 我愿意提交 PR 来实现这个功能 / I am willing to submit a PR to implement this feature
          required: false
